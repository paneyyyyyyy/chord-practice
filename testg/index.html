<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>Chord Testing System - Stable Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #050c14;
  --bg2:       #0a1520;
  --panel:     #0d1c2b;
  --border:    #1a3a5c;
  --accent:    #00c8ff;
  --accent2:   #00ffb3;
  --text:      #c8dff0;
  --text2:     #6a9bbf;
  --text3:     #2a5070;
  --ok:        #00ffb3;
  --ng:        #ff4060;
  --mono:      'Share Tech Mono', monospace;
  --sans:      'Noto Sans TC', sans-serif;
}
* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  -webkit-tap-highlight-color: transparent;
  /* 關鍵修正：防止所有元素的預設觸控縮放行為 */
  touch-action: manipulation;
}
body { 
  background: var(--bg); 
  color: var(--text); 
  font-family: var(--sans); 
  min-height: 100vh; 
  overflow-x: hidden; 
  padding-bottom: 40px;
  /* 防止文字選取干擾點擊 */
  user-select: none;
  -webkit-user-select: none;
}

.overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
.abtn-big { padding: 20px 50px; background: transparent; color: var(--accent); border: 2px solid var(--accent); border-radius: 4px; font-family: var(--mono); font-size: 18px; cursor: pointer; text-transform: uppercase; }

#app { max-width: 800px; margin: 0 auto; display: none; }

.progress-container { width: 100%; height: 4px; background: var(--bg2); position: sticky; top: 0; z-index: 100; }
#progressBar { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s; }

.hdr { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.scores { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--border); background: var(--bg2); }
.sc { padding: 10px; text-align: center; border-right: 1px solid var(--border); }
.sc-n { font-family: var(--mono); font-size: 20px; color: var(--accent); }
.sc-l { font-size: 9px; color: var(--text3); text-transform: uppercase; }

.qwrap { padding: 15px; }
.qcard { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; text-align: center; position: relative; }
.qcard.ok { border-color: var(--ok); box-shadow: 0 0 15px rgba(0,255,179,0.15); }
.qcard.ng { border-color: var(--ng); box-shadow: 0 0 15px rgba(255,64,96,0.15); }

.chord-display { font-family: var(--mono); font-size: 48px; color: var(--accent); margin-bottom: 5px; line-height: 1; }
.chord-slash { font-size: 36px; color: var(--text3); margin: 0 2px; }
.chord-bass { font-size: 36px; color: var(--accent2); }

.inversion-badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent2);
  border: 1px solid var(--accent2);
  border-radius: 3px;
  padding: 2px 8px;
  margin-bottom: 8px;
  opacity: 0.8;
  letter-spacing: 1px;
}

.hint-notes { font-family: var(--mono); font-size: 14px; color: var(--accent2); background: rgba(0,255,179,0.05); padding: 5px 15px; border-radius: 20px; display: inline-block; }

/* 指板容器：確保不被撐開 */
.guitar-container { padding: 10px 15px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.fret-header { display: flex; align-items: center; margin-bottom: 2px; padding-left: 38px; }
.fret-label { font-family: var(--mono); font-size: 10px; color: var(--text3); text-align: center; flex-shrink: 0; }
.string-row { display: flex; align-items: center; margin-bottom: 2px; position: relative; }
.string-name-label { width: 32px; font-family: var(--mono); font-size: 11px; color: var(--text2); text-align: right; padding-right: 6px; flex-shrink: 0; }
.nut { width: 6px; align-self: stretch; background: var(--text2); opacity: 0.5; flex-shrink: 0; border-radius: 1px; }
.fret-cell { position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border-right: 2px solid var(--border); touch-action: manipulation; }
.fret-cell:last-child { border-right: none; }
.string-wire { position: absolute; top: 50%; left: 0; right: 0; pointer-events: none; background: var(--text2); transform: translateY(-50%); }
.fret-dot-marker { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--text3); pointer-events: none; }
.finger-dot { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 500; position: relative; z-index: 2; transition: background 0.1s; cursor: pointer; flex-shrink: 0; touch-action: manipulation; }
.finger-dot.state-empty { background: transparent; color: transparent; }
.finger-dot.state-active { background: var(--accent); color: var(--bg); }
.finger-dot.state-correct { background: var(--ok); color: var(--bg); }
.finger-dot.state-wrong { background: var(--ng); color: #fff; }
.finger-dot.state-missing { background: transparent; border: 2px dashed var(--ok); color: var(--ok); }
.finger-dot.bass-mark::after { content: '▼'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--ng); }

.submit-area { padding: 10px 15px; }
.abtn { padding: 15px; font-family: var(--mono); border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; border-radius: 4px; text-transform: uppercase; width: 100%; }
.abtn.success { border-color: var(--accent2); color: var(--accent2); font-size: 18px; }

.filter-sec { padding: 15px; }
.filter-title { font-family: var(--mono); font-size: 11px; color: var(--text3); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.filter-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.f-btn { padding: 5px 10px; font-size: 11px; background: var(--bg2); border: 1px solid var(--border); color: var(--text2); border-radius: 4px; cursor: pointer; }
.f-btn.on { border-color: var(--accent); color: var(--accent); background: rgba(0,200,255,0.1); }
</style>
</head>
<body>

<div id="unlocker" class="overlay">
  <div style="font-family:var(--mono); color:var(--text3); margin-bottom:10px;">CHORD CHALLENGE - INVERSION MODE</div>
  <button id="startBtn" class="abtn-big">START TRAINING</button>
  <div style="font-size:12px; color:var(--text3); margin-top:20px;">Stable UI & Realistic Synth Tone</div>
</div>

<div id="resultPage" class="overlay" style="display:none;">
  <h2 style="color:var(--accent); font-family:var(--mono);">MISSION COMPLETE</h2>
  <div class="result-score" id="finalScore">0</div>
  <div class="result-detail" id="finalDetail">
    Correct answers: 0 / 20<br>
    Accuracy rate: 0%
  </div>
  <button onclick="location.reload()" class="abtn-big">RESTART</button>
</div>

<div id="app">
  <div class="progress-container"><div id="progressBar"></div></div>
  <div class="hdr"><div class="hdr-logo" id="qProgress">QUESTION 1 / 20</div></div>

  <div class="scores">
    <div class="sc"><div class="sc-n" id="sc">0</div><div class="sc-l">Correct</div></div>
    <div class="sc"><div class="sc-n" id="sw" style="color:var(--ng)">0</div><div class="sc-l">Wrong</div></div>
    <div class="sc"><div class="sc-n" id="totalScore" style="color:var(--accent2)">0</div><div class="sc-l">Total Score</div></div>
  </div>

  <div class="qwrap">
    <div class="qcard" id="qcard">
      <div id="inversionBadge" class="inversion-badge">ROOT POSITION</div>
      <div class="chord-display" id="cname">--</div>
      <div id="ctype" style="font-size:14px; margin-bottom:10px; color:var(--text2);">Loading...</div>
      <div class="hint-notes" id="hnotes" style="visibility:hidden">HINT</div>
    </div>
  </div>

  <div class="guitar-container" id="guitarContainer"></div>

  <div class="submit-area">
    <button class="abtn success" id="submitBtn">CONFIRM & SUBMIT</button>
    <button class="abtn" id="nextBtn" style="display:none; border-color:var(--accent); color:var(--accent); margin-top:10px;">NEXT QUESTION ▶</button>
  </div>

  <div class="filter-sec">
    <div class="filter-title">//練習範圍 (下一題生效)</div>
    <div class="filter-grid" id="filterGrid"></div>
  </div>
</div>

<script>
// --- 音訊模組 ---
let audioCtx = null;
const activeTones = new Map(); 
const GUITAR_BASE_FREQS = [329.63 * 2, 246.94 * 2, 196.00 * 2, 146.83 * 2, 110.00 * 2, 82.41 * 2];

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function stopTone(key) {
  if (activeTones.has(key)) {
    const t = audioCtx.currentTime;
    const items = activeTones.get(key);
    items.oscs.forEach(osc => { try { osc.stop(t); } catch(e) {} });
    items.gain.gain.cancelScheduledValues(t);
    items.gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    activeTones.delete(key);
  }
}

function stopAllTones() {
  const t = audioCtx ? audioCtx.currentTime : 0;
  activeTones.forEach((items, key) => {
    items.oscs.forEach(osc => { try { osc.stop(t); } catch(e) {} });
    items.gain.gain.cancelScheduledValues(t);
    items.gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
  });
  activeTones.clear();
}

function pluckGuitar(key, freq, volume = 0.35) {
  initAudio();
  const t = audioCtx.currentTime;
  const osc1 = audioCtx.createOscillator(); osc1.type = 'sawtooth'; osc1.frequency.value = freq;
  const osc2 = audioCtx.createOscillator(); osc2.type = 'triangle'; osc2.frequency.value = freq * 2.001;
  const osc3 = audioCtx.createOscillator(); osc3.type = 'sine'; osc3.frequency.value = freq * 0.5;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(freq * 12, t);
  filter.frequency.exponentialRampToValueAtTime(freq * 3, t + 0.4);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(volume, t + 0.008);
  gain.gain.exponentialRampToValueAtTime(volume * 0.6, t + 0.05);
  gain.gain.exponentialRampToValueAtTime(volume * 0.15, t + 0.4);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 4.0);

  const g1 = audioCtx.createGain(); g1.gain.value = 0.5;
  const g2 = audioCtx.createGain(); g2.gain.value = 0.3;
  const g3 = audioCtx.createGain(); g3.gain.value = 0.2;

  osc1.connect(g1); osc2.connect(g2); osc3.connect(g3);
  g1.connect(filter); g2.connect(filter); g3.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc1.start(t); osc2.start(t); osc3.start(t);
  activeTones.set(key, { oscs: [osc1, osc2, osc3], gain: gain });
}

// --- 核心資料 ---
const CHORD_TYPES = [
  {id:'maj',   n:'大三',  iv:[0,4,7]},
  {id:'min',   n:'小三',  iv:[0,3,7]},
  {id:'dim',   n:'減三',  iv:[0,3,6]},
  {id:'aug',   n:'增三',  iv:[0,4,8]},
  {id:'7',     n:'屬七',  iv:[0,4,7,10]},
  {id:'maj7',  n:'大七',  iv:[0,4,7,11]},
  {id:'min7',  n:'小七',  iv:[0,3,7,10]},
  {id:'dim7',  n:'減七',  iv:[0,3,6,9]},
  {id:'hdim7', n:'半減七', iv:[0,3,6,10]}
];
const NOTES_NAME = ['C','C#','D','E♭','E','F','F#','G','G#','A','B♭','B'];
const INVERSION_LABELS = ['ROOT POSITION', '1ST INVERSION', '2ND INVERSION', '3RD INVERSION'];

let selectedTypes = new Set(['maj', 'min', '7']);
let Q = null, pressed = new Set(), answered = false;
let correctCount = 0, wrongCount = 0, currentRound = 0;
let showBassMark = false;
const MAX_ROUNDS = 20;

const OPEN_NOTES      = [4, 11, 7, 2, 9, 4];
const STRING_NAMES    = ['e','B','G','D','A','E'];
const FRET_COUNT      = 5;
const MARKER_FRETS    = new Set([3, 5]);
const STRING_THICKNESS = [0.8, 1.1, 1.4, 1.8, 2.2, 2.8]; 

let gPressed = new Map();
for (let s = 0; s < 6; s++) gPressed.set(s, new Set());

function noteAt(s, f) { return (OPEN_NOTES[s] + f) % 12; }
function freqAt(s, f) { return GUITAR_BASE_FREQS[s] * Math.pow(2, f / 12); }

function buildGuitar() {
  const container = document.getElementById('guitarContainer');
  container.innerHTML = '';
  const header = document.createElement('div');
  header.className = 'fret-header';
  const openLbl = document.createElement('div');
  openLbl.className = 'fret-label'; openLbl.style.width = '42px'; openLbl.textContent = 'open';
  header.appendChild(openLbl);
  for (let f = 1; f <= FRET_COUNT; f++) {
    const lbl = document.createElement('div');
    lbl.className = 'fret-label'; lbl.style.width = '52px'; lbl.textContent = f;
    header.appendChild(lbl);
  }
  container.appendChild(header);

  for (let s = 0; s < 6; s++) {
    const row = document.createElement('div'); row.className = 'string-row';
    const nameLbl = document.createElement('div'); nameLbl.className = 'string-name-label'; nameLbl.textContent = STRING_NAMES[s];
    row.appendChild(nameLbl);
    const nut = document.createElement('div'); nut.className = 'nut';
    row.appendChild(nut);

    for (let f = 0; f <= FRET_COUNT; f++) {
      const cell = document.createElement('div');
      cell.className = 'fret-cell'; cell.style.width = f === 0 ? '42px' : '52px'; cell.style.height = '44px';
      const wire = document.createElement('div'); wire.className = 'string-wire'; wire.style.height = STRING_THICKNESS[s] + 'px'; wire.style.opacity = '0.4';
      cell.appendChild(wire);
      if (MARKER_FRETS.has(f) && s === 3) {
        const m = document.createElement('div'); m.className = 'fret-dot-marker'; cell.appendChild(m);
      }
      const dot = document.createElement('div');
      dot.className = 'finger-dot state-empty'; dot.id = `gdot-${s}-${f}`; dot.style.width = '28px'; dot.style.height = '28px'; dot.style.fontSize = '10px';
      cell.appendChild(dot);
      cell.addEventListener('pointerdown', e => { e.preventDefault(); handleGuitarClick(s, f); });
      row.appendChild(cell);
    }
    container.appendChild(row);
  }
}

function handleGuitarClick(s, f) {
  if (answered) return;
  initAudio();
  const key = `${s}-${f}`;
  const frets = gPressed.get(s);
  if (frets.has(f)) {
    frets.delete(f); stopTone(key); 
  } else {
    frets.add(f); pluckGuitar(key, freqAt(s, f)); 
  }
  updateGuitarUI();
}

function getPressedNoteNames() {
  const names = new Set();
  for (let s = 0; s < 6; s++) gPressed.get(s).forEach(f => names.add(noteAt(s, f)));
  return names;
}

function getLowestNoteName() {
  for (let s = 5; s >= 0; s--) {
    const frets = gPressed.get(s);
    if (frets.size > 0) return noteAt(s, Math.min(...frets));
  }
  return -1;
}

function updateGuitarUI() {
  const targetNames  = new Set(Q ? Q.notes.map(n => n % 12) : []);
  const pressedNames = getPressedNoteNames();
  const bassNoteName = Q ? Q.bassNote : -1;
  for (let s = 0; s < 6; s++) {
    for (let f = 0; f <= FRET_COUNT; f++) {
      const dot = document.getElementById(`gdot-${s}-${f}`);
      const nn  = noteAt(s, f);
      const isSel = gPressed.get(s).has(f);
      dot.className = 'finger-dot'; dot.textContent = '';
      if (answered) {
        if (isSel) {
          dot.classList.add(targetNames.has(nn) ? 'state-correct' : 'state-wrong');
          dot.textContent = NOTES_NAME[nn];
        } else if (targetNames.has(nn) && !pressedNames.has(nn)) {
          dot.classList.add('state-missing'); dot.textContent = NOTES_NAME[nn];
        } else { dot.classList.add('state-empty'); }
        if (showBassMark && isSel && nn === bassNoteName) dot.classList.add('bass-mark');
      } else {
        if (isSel) { dot.classList.add('state-active'); dot.textContent = NOTES_NAME[nn]; }
        else { dot.classList.add('state-empty'); }
      }
    }
  }
}

function newQ() {
  stopAllTones(); 
  if (currentRound >= MAX_ROUNDS) { showFinalResult(); return; }
  currentRound++; answered = false; showBassMark = false;
  for (let s = 0; s < 6; s++) gPressed.get(s).clear();
  document.getElementById('qProgress').textContent = `QUESTION ${currentRound} / ${MAX_ROUNDS}`;
  document.getElementById('progressBar').style.width = `${(currentRound / MAX_ROUNDS) * 100}%`;
  document.getElementById('submitBtn').style.display = 'block';
  document.getElementById('nextBtn').style.display = 'none';

  const pool = CHORD_TYPES.filter(t => selectedTypes.has(t.id));
  const t = pool[Math.floor(Math.random() * pool.length)];
  const root = Math.floor(Math.random() * 12);
  const inversionIndex = Math.floor(Math.random() * t.iv.length);
  const noteNames = t.iv.map(iv => (root + iv) % 12);
  const orderedNoteNames = [...noteNames.slice(inversionIndex), ...noteNames.slice(0, inversionIndex)];
  
  const notes = []; let cursor = 0;
  for (const name of orderedNoteNames) {
    let pos = cursor; while (pos % 12 !== name) pos++;
    if (pos > 23) pos -= 12; notes.push(pos); cursor = pos + 1;
  }
  Q = { root, type: t, notes, inversionIndex, bassNote: noteNames[inversionIndex] };
  const chordSuffix = (t.id === 'maj') ? '' : t.id;
  document.getElementById('inversionBadge').textContent = INVERSION_LABELS[inversionIndex];
  if (inversionIndex > 0) {
    document.getElementById('cname').innerHTML = `<span>${NOTES_NAME[root]}${chordSuffix}</span><span class="chord-slash">/</span><span class="chord-bass">${NOTES_NAME[Q.bassNote]}</span>`;
  } else { document.getElementById('cname').textContent = NOTES_NAME[root] + chordSuffix; }
  document.getElementById('ctype').textContent = t.n + '和弦';
  document.getElementById('hnotes').style.visibility = 'hidden';
  document.getElementById('hnotes').textContent = orderedNoteNames.map(n => NOTES_NAME[n]).join(' · ');
  document.getElementById('qcard').className = 'qcard';
  updateGuitarUI();
}

function check() {
  stopAllTones(); 
  if (answered || getPressedNoteNames().size === 0) return;
  const targetNames = new Set(Q.notes.map(n => n % 12));
  const pressedNames = getPressedNoteNames();
  const notesOk = (pressedNames.size === targetNames.size) && [...targetNames].every(n => pressedNames.has(n));
  const lowestName = getLowestNoteName();
  const isOk = notesOk && (lowestName === Q.bassNote);
  showBassMark = !isOk && (lowestName !== Q.bassNote);
  answered = true;
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('qcard').className = isOk ? 'qcard ok' : 'qcard ng';
  if (isOk) correctCount++; else wrongCount++;
  document.getElementById('sc').textContent = correctCount;
  document.getElementById('sw').textContent = wrongCount;
  document.getElementById('totalScore').textContent = correctCount * 5;
  document.getElementById('hnotes').style.visibility = 'visible';
  updateGuitarUI();
}

function showFinalResult() {
  stopAllTones(); document.getElementById('app').style.display = 'none';
  document.getElementById('resultPage').style.display = 'flex';
  document.getElementById('finalScore').textContent = correctCount * 5;
  document.getElementById('finalDetail').innerHTML = `Correct: ${correctCount} / ${MAX_ROUNDS}<br>Score: ${correctCount * 5} / 100`;
}

function initFilters() {
  const grid = document.getElementById('filterGrid');
  CHORD_TYPES.forEach(t => {
    const btn = document.createElement('button'); btn.className = `f-btn ${selectedTypes.has(t.id) ? 'on' : ''}`;
    btn.textContent = t.n;
    btn.onclick = () => {
      if (selectedTypes.has(t.id) && selectedTypes.size > 1) { selectedTypes.delete(t.id); btn.classList.remove('on'); }
      else { selectedTypes.add(t.id); btn.classList.add('on'); }
    };
    grid.appendChild(btn);
  });
}

// --- 修正畫面跑位：阻止多指縮放與雙擊縮放 ---
document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = (new Date()).getTime();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, false);

document.getElementById('startBtn').addEventListener('click', () => {
  initAudio(); document.getElementById('unlocker').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  buildGuitar(); initFilters(); newQ();
});
document.getElementById('submitBtn').onclick = check;
document.getElementById('nextBtn').onclick   = newQ;
</script>
</body>
</html>
