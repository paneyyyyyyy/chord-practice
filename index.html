<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>和弦練習系統 - 音效版</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #050c14;
  --bg2:       #0a1520;
  --bg3:       #0f1e2e;
  --panel:     #0d1c2b;
  --border:    #1a3a5c;
  --accent:    #00c8ff;
  --accent2:   #00ffb3;
  --accent3:   #ff6b35;
  --text:      #c8dff0;
  --text2:     #6a9bbf;
  --text3:     #2a5070;
  --ok:        #00ffb3;
  --ng:        #ff4060;
  --mono:      'Share Tech Mono', monospace;
  --sans:      'Noto Sans TC', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}

/* 背景裝飾 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,200,255,0.015) 2px, rgba(0,200,255,0.015) 4px);
  pointer-events: none;
  z-index: 100;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

#app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 0 40px; }

/* 頂部欄 */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
}
.hdr-logo { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: .2em; text-transform: uppercase; }
.hdr-logo span { color: var(--text3); }
.hdr-ver { font-family: var(--mono); font-size: 10px; color: var(--text3); letter-spacing: .1em; }

/* 分數板 */
.scores { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--border); }
.sc { padding: 10px 6px; text-align: center; border-right: 1px solid var(--border); position: relative; }
.sc:last-child { border-right: none; }
.sc-n { font-family: var(--mono); font-size: 22px; color: var(--accent); }
.sc-n.red { color: var(--ng); }
.sc-n.gold { color: #ffcc00; }
.sc-n.dim { color: var(--text2); }
.sc-l { font-size: 9px; color: var(--text3); letter-spacing: .1em; text-transform: uppercase; margin-top: 2px; }

/* 題目卡片 */
.qwrap { padding: 16px; }
.qcard {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 28px 20px 22px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: border-color .25s;
}
.qcard::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .6;
}
.qcard.ok { border-color: var(--ok); box-shadow: 0 0 20px rgba(0,255,179,.1); }
.qcard.ng { border-color: var(--ng); box-shadow: 0 0 20px rgba(255,64,96,.1); }

.chord-display { font-family: var(--mono); font-size: 58px; color: var(--accent); line-height: 1; margin-bottom: 6px; text-shadow: 0 0 30px rgba(0,200,255,.4); }
.chord-type { font-size: 13px; color: var(--text2); margin-bottom: 8px; }
.inv-tag { display: inline-block; font-family: var(--mono); font-size: 10px; padding: 2px 10px; border: 1px solid var(--border); color: var(--text3); margin-bottom: 10px; }
.hint-notes { font-family: var(--mono); font-size: 14px; color: var(--accent2); padding: 8px 16px; border: 1px solid rgba(0,255,179,.2); background: rgba(0,255,179,.05); display: inline-block; }

.fb-bar { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; font-family: var(--mono); font-size: 13px; text-align: center; opacity: 0; transition: opacity .2s; }
.fb-bar.show { opacity: 1; }
.fb-bar.ok { background: rgba(0,255,179,.15); color: var(--ok); }
.fb-bar.ng { background: rgba(255,64,96,.15); color: var(--ng); }

/* 音符網格 */
.notesec { padding: 0 16px 16px; }
.note-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 10px; }
.nbtn {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  background: var(--bg3); border: 1px solid var(--border); border-radius: 3px;
  font-family: var(--mono); font-size: 13px; color: var(--text2); cursor: pointer;
}
.nbtn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,200,255,.1); }
.nbtn.correct { border-color: var(--ok); color: var(--ok); background: rgba(0,255,179,.1); }
.nbtn.wrong { border-color: var(--ng); color: var(--ng); }
.nbtn.missing { border-style: dashed; border-color: rgba(0,255,179,.3); }

/* 控制按鈕 */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 16px; }
.abtn { padding: 13px; font-family: var(--mono); font-size: 12px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; }
.abtn.primary { border-color: var(--accent); color: var(--accent); }

/* 設定區 */
.settings { margin: 0 16px 16px; border: 1px solid var(--border); }
.stog { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; }
.sbody { display: none; flex-direction: column; gap: 14px; padding: 14px; border-top: 1px solid var(--border); }
.sbody.open { display: flex; }
.tgrid, .igrid { display: flex; flex-wrap: wrap; gap: 5px; }
.tbtn, .ibtn { padding: 5px 10px; font-family: var(--mono); font-size: 10px; border: 1px solid var(--border); background: transparent; color: var(--text3); cursor: pointer; }
.tbtn.on, .ibtn.on { border-color: var(--accent); color: var(--accent); background: rgba(0,200,255,.08); }
</style>
</head>
<body>

<div id="app">
  <div class="hdr">
    <div class="hdr-logo"><span>// </span>和弦練習系統<span> //</span></div>
    <div class="hdr-ver">v2.1 · AUDIO</div>
  </div>

  <div class="scores">
    <div class="sc"><div class="sc-n" id="sc">0</div><div class="sc-l">答對</div></div>
    <div class="sc"><div class="sc-n red" id="sw">0</div><div class="sc-l">答錯</div></div>
    <div class="sc"><div class="sc-n gold" id="ss">0</div><div class="sc-l">連續</div></div>
    <div class="sc"><div class="sc-n dim" id="st">0</div><div class="sc-l">總題</div></div>
  </div>

  <div class="qwrap">
    <div class="qcard" id="qcard">
      <div class="chord-display" id="cname">C</div>
      <div class="chord-type" id="ctype">大三和弦</div>
      <div class="inv-tag" id="invtag" style="display:none"></div><br>
      <div class="hint-notes" id="hnotes" style="visibility:hidden">C · E · G</div>
      <div class="fb-bar" id="fb"></div>
    </div>
  </div>

  <div class="notesec">
    <div class="note-grid" id="noteGrid"></div>
    <div id="pressedRow" style="min-height:20px"></div>
  </div>

  <div class="actions">
    <button class="abtn" id="skipBtn">跳過</button>
    <button class="abtn primary" id="nextBtn">下一題 ▶</button>
  </div>

  <div class="settings">
    <div class="stog" id="stog"><span class="stog-title">// 練習設定</span><span>▼</span></div>
    <div class="sbody" id="sbody">
      <div class="tgrid" id="tgrid"></div>
      <div class="igrid" id="igrid"></div>
    </div>
  </div>
</div>

<script>
// --- 音訊引擎 ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

// 頻率表 (C4 ~ B4)
const FREQS = [261.63, 277.18, 293.66, 311.13, 329.63, 349.23, 369.99, 392.00, 415.30, 440.00, 466.16, 493.88];

function initAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
}

function playTone(idx) {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = 'triangle'; 
  osc.frequency.setValueAtTime(FREQS[idx], audioCtx.currentTime);
  
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.8);
}

function playChord(notes) {
  notes.forEach(n => playTone(n));
}

// --- 邏輯數據 ---
const CT=[
  {id:'maj',  n:'大三',   s:'',      iv:[0,4,7]},
  {id:'min',  n:'小三',   s:'m',     iv:[0,3,7]},
  {id:'dom7', n:'屬七',   s:'7',     iv:[0,4,7,10]},
  {id:'maj7', n:'大七',   s:'maj7',  iv:[0,4,7,11]},
  {id:'min7', n:'小七',   s:'m7',    iv:[0,3,7,10]}
];
const DF=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const IL=['原位','第一轉位','第二轉位','第三轉位'];

let aT=new Set(['maj','min','dom7']);
let aI=new Set([0]);
let Q=null, pressed=new Set(), answered=false;
let correct=0, wrong=0, streak=0, total=0, ft=null;

function getChordNotes(root, tid, inv) {
  const t = CT.find(x => x.id === tid);
  let notes = t.iv.map(v => (root + v) % 12);
  for (let i = 0; i < inv; i++) notes.push(notes.shift());
  return notes;
}

function newQ() {
  answered = false; pressed.clear();
  const tArr = [...aT], iArr = [...aI];
  const tid = tArr[Math.floor(Math.random() * tArr.length)];
  const root = Math.floor(Math.random() * 12);
  const inv = iArr[Math.floor(Math.random() * iArr.length)];
  
  Q = { root, tid, inv };
  const t = CT.find(x => x.id === tid);
  
  document.getElementById('cname').textContent = DF[root] + t.s;
  document.getElementById('ctype').textContent = t.n + '和弦';
  document.getElementById('invtag').style.display = inv > 0 ? 'inline-block' : 'none';
  document.getElementById('invtag').textContent = IL[inv];
  document.getElementById('hnotes').style.visibility = 'hidden';
  document.getElementById('hnotes').textContent = getChordNotes(root, tid, inv).map(n => DF[n]).join(' · ');
  document.getElementById('fb').className = 'fb-bar';
  document.getElementById('qcard').className = 'qcard';
  
  renderNotes();
}

function check() {
  if (answered || !pressed.size) return;
  const target = new Set(getChordNotes(Q.root, Q.tid, Q.inv));
  const isOk = pressed.size === target.size && [...target].every(n => pressed.has(n));
  
  answered = true;
  total++;
  if (isOk) {
    correct++; streak++;
    document.getElementById('qcard').className = 'qcard ok';
    document.getElementById('fb').textContent = '✓ CORRECT';
    document.getElementById('fb').className = 'fb-bar show ok';
    playChord([...target]); // 答對播放完整和弦
    setTimeout(newQ, 1200);
  } else {
    wrong++; streak = 0;
    document.getElementById('qcard').className = 'qcard ng';
    document.getElementById('fb').textContent = '✗ TRY AGAIN';
    document.getElementById('fb').className = 'fb-bar show ng';
  }
  
  document.getElementById('sc').textContent = correct;
  document.getElementById('sw').textContent = wrong;
  document.getElementById('ss').textContent = streak;
  document.getElementById('st').textContent = total;
  document.getElementById('hnotes').style.visibility = 'visible';
  renderNotes();
}

function renderNotes() {
  const grid = document.getElementById('noteGrid');
  grid.innerHTML = '';
  const target = Q ? new Set(getChordNotes(Q.root, Q.tid, Q.inv)) : new Set();
  
  for (let i = 0; i < 12; i++) {
    const btn = document.createElement('button');
    btn.className = 'nbtn';
    btn.textContent = DF[i];
    
    if (answered) {
      if (target.has(i) && pressed.has(i)) btn.classList.add('correct');
      else if (target.has(i)) btn.classList.add('missing');
      else if (pressed.has(i)) btn.classList.add('wrong');
    } else if (pressed.has(i)) {
      btn.classList.add('active');
    }
    
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (answered) return;
      
      playTone(i); // 按下按鈕發出單音
      
      if (pressed.has(i)) pressed.delete(i);
      else pressed.add(i);
      
      renderNotes();
      clearTimeout(ft);
      ft = setTimeout(check, 600);
    });
    grid.appendChild(btn);
  }
}

// 初始化設定介面
function setup() {
  const tgrid = document.getElementById('tgrid');
  CT.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tbtn' + (aT.has(t.id) ? ' on' : '');
    b.textContent = t.n;
    b.onclick = () => {
      if (aT.has(t.id) && aT.size > 1) aT.delete(t.id); else aT.add(t.id);
      b.className = 'tbtn' + (aT.has(t.id) ? ' on' : '');
    };
    tgrid.appendChild(b);
  });

  document.getElementById('stog').onclick = () => {
    document.getElementById('sbody').classList.toggle('open');
  };
  document.getElementById('nextBtn').onclick = newQ;
  document.getElementById('skipBtn').onclick = () => { if(!answered){wrong++; total++; streak=0;} newQ(); };
  
  newQ();
}

setup();
</script>
</body>
</html>
