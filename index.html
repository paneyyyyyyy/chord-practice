<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chord Testing System</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #050c14;
  --bg2:       #0a1520;
  --panel:     #0d1c2b;
  --border:    #1a3a5c;
  --accent:    #00c8ff;
  --accent2:   #00ffb3;
  --text:      #c8dff0;
  --text2:     #6a9bbf;
  --text3:     #2a5070;
  --ok:        #00ffb3;
  --ng:        #ff4060;
  --white-key: #e0e0e0;
  --black-key: #1a1a1a;
  --mono:      'Share Tech Mono', monospace;
  --sans:      'Noto Sans TC', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; overflow-x: hidden; padding-bottom: 40px; }

/* 遮罩通用樣式 */
.overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
.abtn-big { padding: 20px 50px; background: transparent; color: var(--accent); border: 2px solid var(--accent); border-radius: 4px; font-family: var(--mono); font-size: 18px; cursor: pointer; text-transform: uppercase; }

#app { max-width: 800px; margin: 0 auto; display: none; }

/* 進度條 */
.progress-container { width: 100%; height: 4px; background: var(--bg3); position: sticky; top: 0; z-index: 100; }
#progressBar { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s; }

.hdr { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.scores { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--border); background: var(--bg2); }
.sc { padding: 10px; text-align: center; border-right: 1px solid var(--border); }
.sc-n { font-family: var(--mono); font-size: 20px; color: var(--accent); }
.sc-l { font-size: 9px; color: var(--text3); text-transform: uppercase; }

.qwrap { padding: 15px; }
.qcard { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; text-align: center; position: relative; }
.qcard.ok { border-color: var(--ok); box-shadow: 0 0 15px rgba(0,255,179,0.15); }
.qcard.ng { border-color: var(--ng); box-shadow: 0 0 15px rgba(255,64,96,0.15); }
.chord-display { font-family: var(--mono); font-size: 48px; color: var(--accent); margin-bottom: 5px; }
.hint-notes { font-family: var(--mono); font-size: 14px; color: var(--accent2); background: rgba(0,255,179,0.05); padding: 5px 15px; border-radius: 20px; display: inline-block; }

/* 鋼琴鍵盤樣式 */
.piano-container { padding: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
.octave { display: flex; position: relative; height: 160px; background: #000; padding: 2px; border-radius: 4px; }
.key { position: relative; border: 1px solid #999; border-radius: 0 0 4px 4px; cursor: pointer; user-select: none; }
.key.white { width: 35px; height: 150px; background: var(--white-key); z-index: 1; color: #333; font-size: 10px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; font-family: var(--mono); }
.key.black { width: 22px; height: 95px; background: var(--black-key); z-index: 2; margin-left: -11px; margin-right: -11px; border-color: #000; color: #fff; font-size: 8px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; }

/* 狀態顏色修正版 */
.key.active { background-color: var(--accent) !important; color: #fff !important; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); }
.key.correct { background-color: var(--ok) !important; color: var(--bg) !important; }
.key.wrong { background-color: var(--ng) !important; color: #fff !important; box-shadow: 0 0 20px var(--ng) !important; z-index: 10; }
.key.missing { border: 3px dashed var(--ok) !important; box-shadow: inset 0 0 12px var(--ok) !important; z-index: 5; }
.key.black.missing { background-color: var(--black-key) !important; }
.key.white.missing { background-color: var(--white-key) !important; }

.submit-area { padding: 10px 15px; }
.abtn { padding: 15px; font-family: var(--mono); border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; border-radius: 4px; text-transform: uppercase; width: 100%; }
.abtn.success { border-color: var(--accent2); color: var(--accent2); font-size: 18px; }

.filter-sec { padding: 15px; }
.filter-title { font-family: var(--mono); font-size: 11px; color: var(--text3); margin-bottom: 8px; border-bottom: 1px solid var(--border); }
.filter-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.f-btn { padding: 5px 10px; font-size: 11px; background: var(--bg2); border: 1px solid var(--border); color: var(--text2); border-radius: 4px; cursor: pointer; }
.f-btn.on { border-color: var(--accent); color: var(--accent); background: rgba(0,200,255,0.1); }

/* 結算頁面特定樣式 */
.result-score { font-family: var(--mono); font-size: 72px; color: var(--accent2); margin: 20px 0; }
.result-detail { color: var(--text2); margin-bottom: 30px; line-height: 1.6; }
</style>
</head>
<body>

<div id="unlocker" class="overlay">
  <div style="font-family:var(--mono); color:var(--text3); margin-bottom:10px;">CHORD CHALLENGE MODE</div>
  <button id="startBtn" class="abtn-big">START TRAINING</button>
  <div style="font-size:12px; color:var(--text3); margin-top:20px;">Total 20 questions, 5 points each</div>
</div>

<div id="resultPage" class="overlay" style="display:none;">
  <h2 style="color:var(--accent); font-family:var(--mono);">MISSION COMPLETE</h2>
  <div class="result-score" id="finalScore">0</div>
  <div class="result-detail" id="finalDetail">
    Correct answers: 0 / 20<br>
    Accuracy rate: 0%
  </div>
  <button onclick="location.reload()" class="abtn-big">RESTART</button>
</div>

<div id="app">
  <div class="progress-container"><div id="progressBar"></div></div>
  <div class="hdr"><div class="hdr-logo" id="qProgress">QUESTION 1 / 20</div></div>

  <div class="scores">
    <div class="sc"><div class="sc-n" id="sc">0</div><div class="sc-l">Correct</div></div>
    <div class="sc"><div class="sc-n" id="sw" style="color:var(--ng)">0</div><div class="sc-l">Wrong</div></div>
    <div class="sc"><div class="sc-n" id="totalScore" style="color:var(--accent2)">0</div><div class="sc-l">Total Score</div></div>
  </div>

  <div class="qwrap">
    <div class="qcard" id="qcard">
      <div class="chord-display" id="cname">--</div>
      <div id="ctype" style="font-size:14px; margin-bottom:10px; color:var(--text2);">Loading...</div>
      <div class="hint-notes" id="hnotes" style="visibility:hidden">HINT</div>
    </div>
  </div>

  <div class="piano-container">
    <div class="octave" id="octave0"></div>
    <div class="octave" id="octave1"></div>
  </div>

  <div class="submit-area">
    <button class="abtn success" id="submitBtn">CONFIRM & SUBMIT</button>
    <button class="abtn" id="nextBtn" style="display:none; border-color:var(--accent); color:var(--accent); margin-top:10px;">NEXT QUESTION ▶</button>
  </div>

  <div class="filter-sec">
    <div class="filter-title">//練習範圍 (下一題生效)</div>
    <div class="filter-grid" id="filterGrid"></div>
  </div>
</div>

<script>
// --- 音訊模組 ---
let audioCtx = null;
const FREQS = [
  261.63, 277.18, 293.66, 311.13, 329.63, 349.23, 369.99, 392.00, 415.30, 440.00, 466.16, 493.88,
  523.25, 554.37, 587.33, 622.25, 659.25, 698.46, 739.99, 783.99, 830.61, 880.00, 932.33, 987.77
];
const activeNodes = {};

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function startTone(idx) {
  initAudio();
  if (activeNodes[idx]) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(FREQS[idx], audioCtx.currentTime);
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); activeNodes[idx] = { osc, gain };
}

function stopTone(idx) {
  if (!activeNodes[idx]) return;
  const { osc, gain } = activeNodes[idx];
  gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
  setTimeout(() => { osc.stop(); osc.disconnect(); }, 150);
  delete activeNodes[idx];
}

// --- 核心邏輯 ---
const CHORD_TYPES = [
  {id:'maj', n:'大三', iv:[0,4,7]}, {id:'min', n:'小三', iv:[0,3,7]},
  {id:'dim', n:'減三', iv:[0,3,6]}, {id:'aug', n:'增三', iv:[0,4,8]},
  {id:'dom7', n:'屬七', iv:[0,4,7,10]}, {id:'maj7', n:'大七', iv:[0,4,7,11]},
  {id:'min7', n:'小七', iv:[0,3,7,10]}, {id:'dim7', n:'減七', iv:[0,3,6,9]},
  {id:'hdim7', n:'半減七', iv:[0,3,6,10]}
];
const NOTES_NAME = ['C','C#','D','E♭','E','F','F#','G','G#','A','B♭','B'];
const LAYOUT = ['w','b','w','b','w','w','b','w','b','w','b','w'];

let selectedTypes = new Set(['maj', 'min', 'dom7']);
let Q = null, pressed = new Set(), answered = false;
let correctCount = 0, wrongCount = 0, currentRound = 0;
const MAX_ROUNDS = 20;

function buildPiano() {
  for (let oct = 0; oct < 2; oct++) {
    const container = document.getElementById(`octave${oct}`);
    container.innerHTML = '';
    LAYOUT.forEach((type, i) => {
      const idx = oct * 12 + i;
      const key = document.createElement('div');
      key.className = `key ${type === 'w' ? 'white' : 'black'}`;
      key.dataset.idx = idx;
      key.innerHTML = `<span>${NOTES_NAME[i]}</span>`;
      key.addEventListener('pointerdown', e => { e.preventDefault(); handleKeyClick(idx); });
      container.appendChild(key);
    });
  }
}

function handleKeyClick(idx) {
  if (answered) return;
  initAudio();
  if (pressed.has(idx)) { pressed.delete(idx); stopTone(idx); }
  else { pressed.add(idx); startTone(idx); }
  updatePianoUI();
}

function updatePianoUI() {
  const targetNames = new Set(Q ? Q.notes.map(n => n % 12) : []);
  const pressedNames = new Set([...pressed].map(n => n % 12));
  document.querySelectorAll('.key').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    const noteNameIdx = idx % 12;
    el.classList.remove('active', 'correct', 'wrong', 'missing');
    if (answered) {
      if (pressed.has(idx)) {
        if (targetNames.has(noteNameIdx)) el.classList.add('correct');
        else el.classList.add('wrong');
      } else if (targetNames.has(noteNameIdx) && !pressedNames.has(noteNameIdx)) {
        el.classList.add('missing');
      }
    } else if (pressed.has(idx)) el.classList.add('active');
  });
}

function newQ() {
  if (currentRound >= MAX_ROUNDS) {
    showFinalResult();
    return;
  }
  currentRound++;
  answered = false;
  Object.keys(activeNodes).forEach(stopTone);
  pressed.clear();
  
  // UI 更新
  document.getElementById('qProgress').textContent = `QUESTION ${currentRound} / ${MAX_ROUNDS}`;
  document.getElementById('progressBar').style.width = `${(currentRound/MAX_ROUNDS)*100}%`;
  document.getElementById('submitBtn').style.display = 'block';
  document.getElementById('nextBtn').style.display = 'none';

  const pool = CHORD_TYPES.filter(t => selectedTypes.has(t.id));
  const t = pool[Math.floor(Math.random() * pool.length)];
  const root = Math.floor(Math.random() * 12);
  Q = { root, type: t, notes: t.iv.map(v => (root + v)) };
  
  document.getElementById('cname').textContent = NOTES_NAME[root] + (t.id === 'maj' ? '' : t.id);
  document.getElementById('ctype').textContent = t.n + '和弦';
  document.getElementById('hnotes').style.visibility = 'hidden';
  document.getElementById('hnotes').textContent = Q.notes.map(n => NOTES_NAME[n % 12]).join(' · ');
  document.getElementById('qcard').className = 'qcard';
  updatePianoUI();
}

function check() {
  if (answered || !pressed.size) return;
  const targetNames = new Set(Q.notes.map(n => n % 12));
  const pressedNames = new Set([...pressed].map(n => n % 12));
  const isOk = (pressedNames.size === targetNames.size) && [...targetNames].every(n => pressedNames.has(n));
  
  answered = true;
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'block';

  if (isOk) {
    correctCount++;
    document.getElementById('qcard').className = 'qcard ok';
  } else {
    wrongCount++;
    document.getElementById('qcard').className = 'qcard ng';
  }
  
  document.getElementById('sc').textContent = correctCount;
  document.getElementById('sw').textContent = wrongCount;
  document.getElementById('totalScore').textContent = correctCount * 5;
  document.getElementById('hnotes').style.visibility = 'visible';
  updatePianoUI();
}

function showFinalResult() {
  document.getElementById('app').style.display = 'none';
  const resultPage = document.getElementById('resultPage');
  resultPage.style.display = 'flex';
  const finalScore = correctCount * 5;
  document.getElementById('finalScore').textContent = finalScore;
  document.getElementById('finalDetail').innerHTML = `
    Correct answers: ${correctCount} / ${MAX_ROUNDS}<br>
    Score: ${finalScore}  / 100<br>
    Accuracy rate: ${(correctCount/MAX_ROUNDS)*100}%
  `;
}

function initFilters() {
  const grid = document.getElementById('filterGrid');
  CHORD_TYPES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = `f-btn ${selectedTypes.has(t.id) ? 'on' : ''}`;
    btn.textContent = t.n;
    btn.onclick = () => {
      if (selectedTypes.has(t.id) && selectedTypes.size > 1) { selectedTypes.delete(t.id); btn.classList.remove('on'); }
      else { selectedTypes.add(t.id); btn.classList.add('on'); }
    };
    grid.appendChild(btn);
  });
}

document.getElementById('startBtn').addEventListener('click', () => {
  initAudio();
  document.getElementById('unlocker').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  buildPiano();
  initFilters();
  newQ();
});

document.getElementById('submitBtn').onclick = check;
document.getElementById('nextBtn').onclick = newQ;
document.getElementById('skipBtn').onclick = newQ;
</script>
</body>
</html>
