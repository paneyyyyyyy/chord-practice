<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>和弦練習系統 v3.0 - 專業模式</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #050c14;
  --bg2:       #0a1520;
  --bg3:       #0f1e2e;
  --panel:     #0d1c2b;
  --border:    #1a3a5c;
  --accent:    #00c8ff;
  --accent2:   #00ffb3;
  --text:      #c8dff0;
  --text2:     #6a9bbf;
  --text3:     #2a5070;
  --ok:        #00ffb3;
  --ng:        #ff4060;
  --mono:      'Share Tech Mono', monospace;
  --sans:      'Noto Sans TC', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; overflow-x: hidden; }

/* 啟動遮罩 */
#unlocker {
  position: fixed; inset: 0; background: var(--bg); z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#startBtn {
  padding: 20px 50px; background: transparent; color: var(--accent);
  border: 2px solid var(--accent); border-radius: 4px; font-family: var(--mono);
  font-size: 18px; cursor: pointer;
}

#app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 0 40px; display: none; }

.hdr { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.hdr-logo { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: .2em; }

.scores { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--border); }
.sc { padding: 10px 6px; text-align: center; border-right: 1px solid var(--border); }
.sc-n { font-family: var(--mono); font-size: 22px; color: var(--accent); }
.sc-l { font-size: 9px; color: var(--text3); text-transform: uppercase; margin-top: 2px; }

.qwrap { padding: 16px; }
.qcard {
  background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
  padding: 28px 20px 22px; text-align: center; position: relative; transition: all .25s;
}
.qcard.ok { border-color: var(--ok); box-shadow: 0 0 20px rgba(0,255,179,0.1); }
.qcard.ng { border-color: var(--ng); box-shadow: 0 0 20px rgba(255,64,96,0.1); }

.chord-display { font-family: var(--mono); font-size: 58px; color: var(--accent); line-height: 1; margin-bottom: 6px; }
.hint-notes { font-family: var(--mono); font-size: 14px; color: var(--accent2); padding: 8px 16px; border: 1px solid rgba(0,255,179,0.2); background: rgba(0,255,179,0.05); display: inline-block; }

.note-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 0 16px 16px; }
.nbtn {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  background: var(--bg3); border: 1px solid var(--border); border-radius: 3px;
  font-family: var(--mono); font-size: 13px; color: var(--text2); cursor: pointer; user-select: none;
}
.nbtn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,200,255,0.2); box-shadow: 0 0 10px rgba(0,200,255,0.2); }
.nbtn.correct { border-color: var(--ok); color: var(--ok); background: rgba(0,255,179,0.1); }
.nbtn.wrong { border-color: var(--ng); color: var(--ng); }
.nbtn.missing { border-style: dashed; border-color: rgba(0,255,179,0.3); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 8px; }
.submit-area { padding: 0 16px 16px; }
.abtn { padding: 13px; font-family: var(--mono); font-size: 12px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; width: 100%; }
.abtn.primary { border-color: var(--accent); color: var(--accent); font-weight: bold; }
.abtn.success { border-color: var(--accent2); color: var(--accent2); font-size: 16px; letter-spacing: 2px; }
</style>
</head>
<body>

<div id="unlocker">
  <button id="startBtn">START SYSTEM</button>
</div>

<div id="app">
  <div class="hdr">
    <div class="hdr-logo">和弦練習系統 v3.0</div>
  </div>

  <div class="scores">
    <div class="sc"><div class="sc-n" id="sc">0</div><div class="sc-l">Correct</div></div>
    <div class="sc"><div class="sc-n" id="sw" style="color:var(--ng)">0</div><div class="sc-l">Wrong</div></div>
    <div class="sc"><div class="sc-n" id="ss" style="color:#ffcc00">0</div><div class="sc-l">Streak</div></div>
    <div class="sc"><div class="sc-n" id="st" style="color:var(--text3)">0</div><div class="sc-l">Total</div></div>
  </div>

  <div class="qwrap">
    <div class="qcard" id="qcard">
      <div class="chord-display" id="cname">C</div>
      <div id="ctype" style="font-size:13px; margin-bottom:10px;">大三和弦</div>
      <div class="hint-notes" id="hnotes" style="visibility:hidden">C · E · G</div>
    </div>
  </div>

  <div class="note-grid" id="noteGrid"></div>

  <div class="submit-area">
    <button class="abtn success" id="submitBtn">CONFIRM & SUBMIT</button>
  </div>

  <div class="actions">
    <button class="abtn" id="skipBtn">跳過</button>
    <button class="abtn primary" id="nextBtn">下一題 ▶</button>
  </div>
</div>

<script>
// --- 音訊引擎 (支援持續音) ---
let audioCtx = null;
const FREQS = [
  261.63, 277.18, 293.66, 311.13, 329.63, 349.23, 369.99, 392.00, 415.30, 440.00, 466.16, 493.88,
  523.25, 554.37, 587.33, 622.25, 659.25, 698.46, 739.99, 783.99, 830.61, 880.00, 932.33, 987.77
];

// 存放目前正在發聲的音點
const activeNodes = {};

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function startTone(idx) {
  initAudio();
  if (activeNodes[idx]) return; // 已經在響了

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = 'triangle';
  const f = FREQS[idx] || (FREQS[idx % 12] * 2);
  osc.frequency.setValueAtTime(f, audioCtx.currentTime);
  
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05); // 稍微有淡入感
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  
  activeNodes[idx] = { osc, gain };
}

function stopTone(idx) {
  if (!activeNodes[idx]) return;
  const { osc, gain } = activeNodes[idx];
  const now = audioCtx.currentTime;
  
  gain.gain.cancelScheduledValues(now);
  gain.gain.setValueAtTime(gain.gain.value, now);
  gain.gain.linearRampToValueAtTime(0, now + 0.1); // 短暫淡出防止爆音
  
  setTimeout(() => {
    osc.stop();
    osc.disconnect();
  }, 150);
  
  delete activeNodes[idx];
}

function stopAllTones() {
  Object.keys(activeNodes).forEach(idx => stopTone(idx));
}

// --- 邏輯數據 ---
const CT=[
  {id:'maj', n:'大三', s:'', iv:[0,4,7]},
  {id:'min', n:'小三', s:'m', iv:[0,3,7]},
  {id:'dom7', n:'屬七', s:'7', iv:[0,4,7,10]},
  {id:'maj7', n:'大七', s:'maj7', iv:[0,4,7,11]},
  {id:'min7', n:'小七', s:'m7', iv:[0,3,7,10]}
];
const DF=['C','C#','D','D#','E','F','F#','G','G#','A','B♭','B'];
let Q=null, pressed=new Set(), answered=false;
let correct=0, wrong=0, streak=0, total=0;

function newQ() {
  answered = false; 
  stopAllTones(); 
  pressed.clear();
  const t = CT[Math.floor(Math.random()*CT.length)];
  const root = Math.floor(Math.random()*12);
  Q = { root, tid: t.id, t };
  
  document.getElementById('cname').textContent = DF[root] + t.s;
  document.getElementById('ctype').textContent = t.n + '和弦';
  document.getElementById('hnotes').style.visibility = 'hidden';
  document.getElementById('hnotes').textContent = t.iv.map(v => DF[(root+v)%12]).join(' · ');
  document.getElementById('qcard').className = 'qcard';
  document.getElementById('submitBtn').style.display = 'block';
  renderNotes();
}

function check() {
  if (answered || !pressed.size) return;
  const target = new Set(Q.t.iv.map(v => (Q.root+v)%12));
  const isOk = (pressed.size === target.size) && [...target].every(n => pressed.has(n));
  
  answered = true; total++;
  document.getElementById('submitBtn').style.display = 'none';

  if (isOk) {
    correct++; streak++;
    document.getElementById('qcard').className = 'qcard ok';
    // 答對時讓和弦鳴響一段時間後關閉
    setTimeout(newQ, 2000);
  } else {
    wrong++; streak = 0;
    document.getElementById('qcard').className = 'qcard ng';
  }
  
  document.getElementById('sc').textContent = correct;
  document.getElementById('sw').textContent = wrong;
  document.getElementById('ss').textContent = streak;
  document.getElementById('st').textContent = total;
  document.getElementById('hnotes').style.visibility = 'visible';
  renderNotes();
}

function renderNotes() {
  const grid = document.getElementById('noteGrid');
  grid.innerHTML = '';
  const target = Q ? new Set(Q.t.iv.map(v => (Q.root+v)%12)) : new Set();
  
  for (let i = 0; i < 12; i++) {
    const btn = document.createElement('button');
    btn.className = 'nbtn';
    btn.textContent = DF[i];
    
    if (answered) {
      if (target.has(i) && pressed.has(i)) btn.classList.add('correct');
      else if (target.has(i)) btn.classList.add('missing');
      else if (pressed.has(i)) btn.classList.add('wrong');
    } else if (pressed.has(i)) {
      btn.classList.add('active');
    }
    
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      initAudio();
      if (answered) return;
      
      if (pressed.has(i)) {
        pressed.delete(i);
        stopTone(i);
      } else {
        pressed.add(i);
        startTone(i);
      }
      renderNotes();
    });
    grid.appendChild(btn);
  }
}

document.getElementById('startBtn').addEventListener('click', () => {
  initAudio();
  document.getElementById('unlocker').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  newQ();
});

document.getElementById('submitBtn').onclick = check;
document.getElementById('nextBtn').onclick = newQ;
document.getElementById('skipBtn').onclick = newQ;
</script>
</body>
</html>
